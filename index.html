<script>
/* ------------------------------------------------------------
   1) Map
------------------------------------------------------------ */
const map = L.map("map", { zoomControl:true }).setView([44.2, -96.5], 6);

// ---------------------------------------------------------------------
/* (removed) leaflet-velocity DOM relocation workaround (not needed with #map absolute layout) */

/* ------------------------------------------------------------
   Story START button (temporary: opens your Google Sheet in a new tab)
------------------------------------------------------------ */
const STORY_SHEET_URL = "https://docs.google.com/spreadsheets/d/17Hzg7R2fSHJGbOKAKMqG4QAqA1GlSJwFM-SQwPhQObY/edit?gid=0#gid=0";
const beginBtn = document.getElementById("beginStoryBtn");
if (beginBtn){
  beginBtn.addEventListener("click", () => window.open(STORY_SHEET_URL, "_blank"));
}


const osm = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
  { attribution: "© OpenStreetMap © CARTO", subdomains:"abcd", maxZoom: 19 }
).addTo(map);

// --- MODIS True Color (NASA GIBS) ---
// Uses GIBS WMTS REST pattern adapted as XYZ tiles:
// https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/{Layer}/default/{YYYY-MM-DD}/{TileMatrixSet}/{z}/{y}/{x}.jpg
function ymd(d){
  const Y = d.getUTCFullYear();
  const M = String(d.getUTCMonth()+1).padStart(2,"0");
  const D = String(d.getUTCDate()).padStart(2,"0");
  return `${Y}-${M}-${D}`;
}
function modisUrlForDate(d){
  const day = ymd(d);
  return `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${day}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`;
}
const modis = L.tileLayer(modisUrlForDate(new Date(Date.UTC(2018,3,14,0,0,0))), {
  attribution: "NASA GIBS",
  maxZoom: 9,
  opacity: 0.70
});
// (Not added by default; turn it on via the Layers control)

// Optional label tiles (Carto light labels)
const labels = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",
  { attribution: "", subdomains:"abcd", maxZoom: 19, pane: "overlayPane" }
);

// --- Extra Midwest city labels (shows more as you zoom in) ---
const cityLabelLayer = L.layerGroup().addTo(map);

function makeCityLabel(name, lat, lon){
  return L.marker([lat,lon], {
    interactive: false,
    icon: L.divIcon({
      className: "town-label",
      html: name,
      iconSize: null
    })
  });
}

const CITIES_TIER1 = [
  ["Sioux Falls", 43.5446, -96.7311],
  ["Omaha", 41.2565, -95.9345],
  ["Minneapolis", 44.9778, -93.265],
  ["Des Moines", 41.5868, -93.625],
  ["Denver", 39.7392, -104.9903],
  ["Kansas City", 39.0997, -94.5786],

function parseISOZ(s){
  // '2018-04-12T00:00:00Z' -> Date
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

async function loadAlertsTimelineIndex(){
  try {
    const r = await fetch('./timeline_index.json', { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const idx = await r.json();
    if (!Array.isArray(idx) || !idx.length) throw new Error('empty index');
    ALERTS_TIMELINE = idx
      .map(x => ({...x, _d: parseISOZ(x.t)}))
      .filter(x => x._d);
    ALERTS_TIMELINE.sort((a,b)=>a._d-b._d);
    ALERTS_MIN = ALERTS_TIMELINE[0]._d;
    ALERTS_MAX = ALERTS_TIMELINE[ALERTS_TIMELINE.length-1]._d;
  } catch(e){
    // Not fatal: we'll fall back to the old per-hour filenames
    console.warn('No timeline_index.json found or unreadable:', e.message);
    ALERTS_TIMELINE = null;
    ALERTS_MIN = null;
    ALERTS_MAX = null;
  }
}

function snapCurrentToAlertsTimeline(){
  if (!ALERTS_TIMELINE || !ALERTS_TIMELINE.length) return null;
  // clamp
  if (current < ALERTS_MIN) current = new Date(ALERTS_MIN.getTime());
  if (current > ALERTS_MAX) current = new Date(ALERTS_MAX.getTime());
  // nearest
  let best = ALERTS_TIMELINE[0];
  let bestDt = Math.abs(current - best._d);
  for (let i=1;i<ALERTS_TIMELINE.length;i++){
    const it = ALERTS_TIMELINE[i];
    const dt = Math.abs(current - it._d);
    if (dt < bestDt){ best = it; bestDt = dt; }
  }
  // snap label/time to the actual frame time to avoid confusing 'out of range' times
  current = new Date(best._d.getTime());
  return best;
}


function fmtZ(d){
  const Y = d.getUTCFullYear();
  const M = String(d.getUTCMonth()+1).padStart(2,"0");
  const D = String(d.getUTCDate()).padStart(2,"0");
  const H = String(d.getUTCHours()).padStart(2,"0");
  return `${Y}-${M}-${D} ${H}Z`;
}
function toISOZ(d){
  const Y = d.getUTCFullYear();
  const M = String(d.getUTCMonth()+1).padStart(2,"0");
  const D = String(d.getUTCDate()).padStart(2,"0");
  const H = String(d.getUTCHours()).padStart(2,"0");
  return `${Y}-${M}-${D}T${H}:00:00Z`;
}

function formatCentralLabel(dUtc) {
  // Display in "Central time" without DST complexity for students.
  // April is technically CDT, but we keep a fixed -5 hour offset for clarity.
  const central = new Date(dUtc.getTime() - 5*3600*1000); // UTC -> Central (approx)
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const m = months[central.getUTCMonth()];
  const day = central.getUTCDate();
  const year = central.getUTCFullYear();
  let hr = central.getUTCHours();
  const ampm = hr >= 12 ? "PM" : "AM";
  hr = hr % 12; if (hr === 0) hr = 12;
  return `${m} ${day}, ${year} ${hr}${ampm}`;
}

  if (ALERTS_TIMELINE && ALERTS_TIMELINE.length){

    timeSlider.max = Math.max(0, TIMELINE.length - 1);
    syncSliderToCurrent();
  }

function nearestTimelineIndex(d){
  if (!TIMELINE.length) return 0;
  let bestI = 0;
  let bestDt = Math.abs(d - TIMELINE[0]);
  for (let i=1;i<TIMELINE.length;i++){
    const dt = Math.abs(d - TIMELINE[i]);
    if (dt < bestDt){ bestDt = dt; bestI = i; }
  }
  return bestI;
}

  if (!timeSlider || !TIMELINE.length) return;
  timeSlider.value = String(nearestTimelineIndex(current));

/* ------------------------------------------------------------
   5) Collision thinning (drop stations if overlapping)
------------------------------------------------------------ */
class CollisionIndex {
  constructor(cellSizePx){
    this.cell = cellSizePx;
    this.grid = new Map();
  }
  _key(cx, cy){ return `${cx},${cy}`; }
  _cellOf(p){ return [Math.floor(p.x / this.cell), Math.floor(p.y / this.cell)]; }
  canPlace(p, minSepPx){
    const [cx, cy] = this._cellOf(p);
    const r2 = minSepPx * minSepPx;
    for (let dx=-1; dx<=1; dx++){
      for (let dy=-1; dy<=1; dy++){
        const key = this._key(cx+dx, cy+dy);
        const arr = this.grid.get(key);
        if (!arr) continue;
        for (const q of arr){
          const ddx = p.x - q.x;
          const ddy = p.y - q.y;
          if ((ddx*ddx + ddy*ddy) < r2) return false;
        }
      }
    }
    const key = this._key(cx, cy);
    if (!this.grid.has(key)) this.grid.set(key, []);
    this.grid.get(key).push({x:p.x, y:p.y});
    return true;
  }
}

function minSepForZoom(z){
  // Fallback step function (used if dynamic cannot compute bounds)
  if (z <= 4) return 92;   // very wide
  if (z === 5) return 70;  // wide
  if (z === 6) return 46;  // starting to fill in
  if (z === 7) return 22;  // SD-ish view: mostly filled in
  return 0;                // z >= 8 show all
}

function dynamicMinSep(){
  // More robust thinning:
  // - Use zoom AND the current viewport span (degrees).
  // - When the view is "state-sized" (like SD filling the screen), show essentially all stations.
  try{
    const z = map.getZoom();
    const b = map.getBounds();
    const spanLon = Math.abs(b.getEast() - b.getWest());
    const spanLat = Math.abs(b.getNorth() - b.getSouth());
    const span = Math.max(spanLon, spanLat);

    // If the current view is roughly state-sized (or tighter), let stations fill in.
    if (span <= 7.5) return 0;

    return minSepForZoom(z);
  }catch(e){
    return minSepForZoom(map.getZoom());
  }
}

function allowByCollision(index, lat, lon, minSepPx){
  if (minSepPx <= 0) return true;
  const p = map.latLngToLayerPoint([lat, lon]);
  return index.canPlace(p, minSepPx);
}

   6) Color ramps
------------------------------------------------------------ */
function piecewiseColor(x, stops){
  if (x == null || !Number.isFinite(x)) return "rgb(255,255,255)";
  if (x <= stops[0].v) return `rgb(${stops[0].c.join(",")})`;
  if (x >= stops[stops.length-1].v) return `rgb(${stops[stops.length-1].c.join(",")})`;
  for (let i=0; i<stops.length-1; i++){
    const a = stops[i], b = stops[i+1];
    if (x >= a.v && x <= b.v){
      const k = (x - a.v) / (b.v - a.v);
      const r = Math.round(a.c[0] + (b.c[0]-a.c[0]) * k);
      const g = Math.round(a.c[1] + (b.c[1]-a.c[1]) * k);
      const bb= Math.round(a.c[2] + (b.c[2]-a.c[2]) * k);
      return `rgb(${r},${g},${bb})`;
    }
  }
  return "rgb(255,255,255)";
}

function tempColorF(t){
  return piecewiseColor(t, [
    {v: 10, c: [170, 220, 255]},
    {v: 20, c: [120, 190, 255]},
    {v: 30, c: [0, 70, 200]},
    {v: 40, c: [0, 170, 0]},

    {v: 60, c: [255, 235, 0]},
    {v: 70, c: [255, 140, 0]},
    {v: 85, c: [255, 80, 0]}
  ]);
}

function dewColorF(td){

    {v: 70, c: [0, 90, 0]}
  ]);
}

function windColorMph(spd){

    {v: 0,  c: [0, 40, 160]},

    {v: 35, c: [255, 220, 0]},
    {v: 50, c: [255, 120, 0]},
    {v: 70, c: [255, 80, 0]}

}

function pressureTrendColor(deltaInHg){
  if (deltaInHg == null || !Number.isFinite(deltaInHg)) return "rgb(248,248,248)";
  if (deltaInHg > 0.02)  return "rgb(215,245,215)";
  if (deltaInHg < -0.02) return "rgb(255,220,220)";
  return "rgb(240,240,240)";
}

function visStyle(vis){
  if (vis == null || !Number.isFinite(vis)) {
    return { bg:"rgba(255,255,255,0.65)", border:"#333" };
  }
  const v = Math.max(0, Math.min(10, vis));
  const alpha = 1 - (v / 10);
  const border = (v < 1) ? "#666" : "#333";
  return { bg:`rgba(255,255,255,${alpha.toFixed(3)})`, border };
}

/* ------------------------------------------------------------
   7b) Sun position (simple) + Weather icon mapping
   - Used for "clear" day vs night so we don't show a sun at night.
------------------------------------------------------------ */
function julianDayUTC(d){
  // d is a JS Date (UTC assumed)
  const Y = d.getUTCFullYear();
  const M = d.getUTCMonth() + 1;
  const D = d.getUTCDate();
  const H = d.getUTCHours() + d.getUTCMinutes()/60 + d.getUTCSeconds()/3600;
  let y = Y, m = M;
  if (m <= 2){ y -= 1; m += 12; }
  const A = Math.floor(y/100);
  const B = 2 - A + Math.floor(A/4);
  const JD0 = Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + D + B - 1524.5;
  return JD0 + H/24;
}

function solarElevationDeg(lat, lon, dUtc){
  // Approx solar elevation (degrees) using common NOAA-style math.
  // lat, lon in degrees (lon positive east; here we use west-negative which is fine).
  const rad = Math.PI/180;
  const JD = julianDayUTC(dUtc);
  const T = (JD - 2451545.0) / 36525.0;

  // Sun geom mean longitude + anomaly
  let L0 = 280.46646 + T*(36000.76983 + T*0.0003032);
  L0 = ((L0 % 360) + 360) % 360;
  const M = 357.52911 + T*(35999.05029 - 0.0001537*T);

  // Eccentricity
  const e = 0.016708634 - T*(0.000042037 + 0.0000001267*T);

  // Sun equation of center
  const C = (1.914602 - T*(0.004817 + 0.000014*T))*Math.sin(M*rad)
          + (0.019993 - 0.000101*T)*Math.sin(2*M*rad)
          + 0.000289*Math.sin(3*M*rad);

  // True longitude
  const trueLong = L0 + C;

  // Apparent longitude
  const omega = 125.04 - 1934.136*T;
  const lambda = trueLong - 0.00569 - 0.00478*Math.sin(omega*rad);

  // Mean obliquity + corrected obliquity
  const eps0 = 23 + (26 + ((21.448 - T*(46.815 + T*(0.00059 - T*0.001813))))/60)/60;
  const eps = eps0 + 0.00256*Math.cos(omega*rad);

  // Declination
  const sinDec = Math.sin(eps*rad) * Math.sin(lambda*rad);
  const dec = Math.asin(sinDec);

  // Equation of time (minutes)
  const y = Math.tan((eps*rad)/2); 
  const y2 = y*y;

  const sin2L0 = Math.sin(2*L0*rad);
  const sinM  = Math.sin(M*rad);
  const cos2L0 = Math.cos(2*L0*rad);
  const sin4L0 = Math.sin(4*L0*rad);
  const sin2M = Math.sin(2*M*rad);

  const Etime = 4 * (y2*sin2L0 - 2*e*sinM + 4*e*y2*sinM*cos2L0 - 0.5*y2*y2*sin4L0 - 1.25*e*e*sin2M) * 180/Math.PI;

  // True solar time (minutes)
  const mins = dUtc.getUTCHours()*60 + dUtc.getUTCMinutes() + dUtc.getUTCSeconds()/60;
  const tst = (mins + Etime + 4*lon) % 1440;

  // Hour angle
  let ha = (tst/4 < 0) ? (tst/4 + 180) : (tst/4 - 180);
  ha = ha * rad;

  const latR = lat * rad;
  const cosZen = Math.sin(latR)*Math.sin(dec) + Math.cos(latR)*Math.cos(dec)*Math.cos(ha);
  const zen = Math.acos(Math.max(-1, Math.min(1, cosZen)));
  const elev = 90 - zen / rad;
  return elev;
}

function isDaylightAt(lat, lon, dUtc){
  return solarElevationDeg(lat, lon, dUtc) > 0;
}

function normalizeWxCode(s){
  return (s || "").toUpperCase().replace(/\s+/g, " ").trim();
}

function pickWxEmoji(wxcodes, isDay){
  // Priority-based parsing. Works even if multiple codes exist ("-SN BR").
  const wx = normalizeWxCode(wxcodes);

  // If no codes, treat as "clear/none"
  if (!wx) return isDay ? "☀️" : "🌙";

  // Thunder first
  if (wx.includes("TS")) return "⛈️";

  // Freezing rain / ice pellets
  if (wx.includes("FZRA") || wx.includes("PL") || wx.includes("IC")) return "🧊";

  // Snow / sleet / snow grains
  if (wx.includes("SN") || wx.includes("SG")) return "🌨️";

  // Rain / drizzle
  if (wx.includes("RA") || wx.includes("DZ")) return "🌧️";

  // Fog / mist / haze / smoke / blowing dust
  if (wx.includes("FG") || wx.includes("BR") || wx.includes("HZ") || wx.includes("FU") || wx.includes("DU")) return "🌫️";

  // Showers
  if (wx.includes("SH")) return "🌦️";

  // Default: cloud (unknown or other)
  return "☁️";
}

function wxEmojiIcon(wxcodes, isDay, size=30){
  const emoji = pickWxEmoji(wxcodes, isDay);
  // Slightly larger emoji for readability; keep the circle consistent.
  return L.divIcon({

    html:`<div class="dot"
              style="width:${size}px;height:${size}px;
                     background:rgba(255,255,255,0.92);
                     border-color:#999;

                     line-height:1;">${emoji}</div>`,
    iconSize:[size,size],
    iconAnchor:[size/2,size/2]
  });
}
function windArrowIcon(bearingDeg, mph){
  const spd = (mph == null || !Number.isFinite(mph)) ? 0 : mph;
  const color = windColorMph(spd);

  const Lmin = 14, Lmax = 52;
  const len = Math.max(Lmin, Math.min(Lmax, Lmin + spd * 0.65));

  const w = 60, h = 60;
  const cx = w/2, cy = h/2;

  const svg = `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <g transform="translate(${cx},${cy})">
        <line x1="0" y1="${len/2}" x2="0" y2="${-len/2}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>
        <polygon points="0,${-len/2-8} -8,${-len/2+6} 8,${-len/2+6}" fill="${color}"/>
      </g>
    </svg>
  `;

  return L.divIcon({
    className:"",
    html:`<div style="width:${w}px;height:${h}px;transform:rotate(${bearingDeg}deg);">
            ${svg}
          </div>`,
    iconSize:[w,h],
    iconAnchor:[w/2,h/2]
  });
}

  return Number.isFinite(n) ? n : null;
}
function ktToMph(kt){ return kt == null ? null : (kt * 1.15078); }

function parseVisMiles(raw){
  if (raw == null) return { miles:null, label:"" };
  let s = String(raw).trim();
  if (!s) return { miles:null, label:"" };

  if (s.startsWith("M")) s = s.slice(1);
  s = s.replace(/\s+/g, " ");

  const n = Number(s);
  if (Number.isFinite(n)) return { miles:n, label:formatVisLabel(n) };

  const parts = s.split(" ");
  let whole = 0;
  let frac = null;

  if (parts.length === 2){
    whole = Number(parts[0]);
    frac = parts[1];
  } else {
    frac = parts[0];
  }

  if (frac && frac.includes("/")){
    const [a,b] = frac.split("/").map(Number);
    if (Number.isFinite(a) && Number.isFinite(b) && b !== 0){
      const val = (Number.isFinite(whole) ? whole : 0) + (a/b);
      return { miles:val, label:formatVisLabel(val) };
    }
  }
  return { miles:null, label:String(raw).trim() };
}
function formatVisLabel(x){
  if (!Number.isFinite(x)) return "";
  if (x >= 10) return "10+";

  const denom = 8;
  const whole = Math.floor(x);
  const frac = x - whole;
  const nume = Math.round(frac * denom);

  if (nume === 0) return String(whole);
  if (nume === denom) return String(whole + 1);

  const gcd = (a,b)=>b?gcd(b,a%b):a;
  const g = gcd(nume, denom);
  const n = nume / g;
  const d = denom / g;

  if (whole === 0) return `${n}/${d}`;
  return `${whole} ${n}/${d}`;
}

function popupHTML(r, dAlt){
  const tmp = num(r.tmpf);
  const dew = num(r.dwpf);
  const drct = num(r.drct);
  const sknt = num(r.sknt);
  const gust = num(r.gust);
  const alti = num(r.alti);

  const mph  = sknt != null ? Math.round(ktToMph(sknt)) : "—";
  const gmh  = gust != null ? Math.round(ktToMph(gust)) : "—";
  const altTxt = alti != null ? alti.toFixed(2) : "—";
  const dTxt = (dAlt == null) ? "—" : `${dAlt > 0 ? "+" : ""}${dAlt.toFixed(2)} in/3h`;

  const visObj = parseVisMiles(r.vsby);
  const visTxt = (visObj.label || r.vsby || "—");

  const toDir = (drct != null) ? ((drct + 180) % 360) : null;

  return `
    <div style="font:600 13px/1.3 Arial,sans-serif">
      <div style="font-size:14px;margin-bottom:4px"><b>${r.station || "Station"}</b></div>
      <div style="opacity:.85;margin-bottom:6px">Valid: ${r.valid || ""} UTC</div>
      <div>Temp: <b>${tmp == null ? "—" : Math.round(tmp)}</b> °F</div>
      <div>Dew Pt: <b>${dew == null ? "—" : Math.round(dew)}</b> °F</div>
      <div>Wind: <b>${mph}</b> mph (gust <b>${gmh}</b>)</div>
      <div>Wind dir (FROM): <b>${drct == null ? "—" : drct.toFixed(0)}°</b></div>
      <div>Arrow points (TO): <b>${toDir == null ? "—" : toDir.toFixed(0)}°</b></div>
      <div>Vis: <b>${visTxt}</b> mi</div>
      <div>Altimeter: <b>${altTxt}</b> inHg</div>
      <div>Alt trend (3h): <b>${dTxt}</b></div>
      <div>Wx: <b>${(r.wxcodes || "").trim() || "—"}</b></div>
    </div>
  `;
}

const reportType = 3;
const SD_ONLY = ["SD_ASOS"];
const REST = ["MN_ASOS","IA_ASOS","NE_ASOS","ND_ASOS","WI_ASOS","IL_ASOS","MI_ASOS","MT_ASOS","WY_ASOS","KS_ASOS","MO_ASOS","CO_ASOS"];

function asosURL(d, networks){
  const iso = toISOZ(d);
  return "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py"
    + "?data=tmpf&data=dwpf&data=drct&data=sknt&data=gust&data=vsby&data=alti&data=wxcodes"
    + `&network=${encodeURIComponent(networks.join(","))}`
    + `&report_type=${reportType}`
    + "&latlon=yes&format=onlycomma&tz=UTC"
    + `&sts=${encodeURIComponent(iso)}`
    + `&ets=${encodeURIComponent(iso)}`
    + "&missing=empty";
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith("#"));
  if (lines.length < 2) return [];
  const header = lines[0].split(",");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    const obj = {};
    header.forEach((h,i)=>obj[h]=cols[i] ?? "");
    return obj;
  });
}

async function fetchRows(d, networks){
  const resp = await fetch(asosURL(d, networks), { cache:"no-store" });
  if (!resp.ok) throw new Error(`METAR HTTP ${resp.status}`);
  return parseCSV(await resp.text());
}

const NWS_EVENT_COLOR = {
  // Severe / Flood (from NWS Hazards Map colors)
  "Tornado Warning": "#FF0000",
  "Severe Thunderstorm Warning": "#FFA500",
  "Flash Flood Warning": "#8B0000",
  "Flash Flood Watch": "#2E8B57",
  "Flood Warning": "#00FF00",
  "Flood Advisory": "#00FF7F",
  "Flood Watch": "#2E8B57",

  // Winter
  "Blizzard Warning": "#FF4500",
  "Winter Storm Warning": "#FF69B4",
  "Winter Storm Watch": "#4682B4",
  "Winter Weather Advisory": "#7B68EE",
  "Ice Storm Warning": "#8B008B",
  "Snow Squall Warning": "#C71585",

  // Wind / Other
  "High Wind Warning": "#DAA520",
  "Wind Advisory": "#D2B48C",
  "Dense Fog Advisory": "#708090"
};

function pickProp(p, keys){
  if (!p) return "";
  for (const k of keys){
    if (p[k] != null && String(p[k]).trim() !== "") return String(p[k]).trim();
    const kk = Object.keys(p).find(x => x.toLowerCase() === k.toLowerCase());
    if (kk && p[kk] != null && String(p[kk]).trim() !== "") return String(p[kk]).trim();
  }
  return "";
}

function eventNameFromProps(p){
  const e = pickProp(p, ["event","headline","name","title"]);
  if (e) return e;

  const phen = pickProp(p, ["phenomena","phenom","PHENOM","phen"]);
  const sig  = pickProp(p, ["significance","sig","SIG"]);
  if (phen && sig){
    const key = `${phen}.${sig}`.toUpperCase();
    // Common VTEC phenom.sig -> human name
    const MAP = {
      'BZ.W':'Blizzard Warning',
      'WS.W':'Winter Storm Warning',
      'WS.A':'Winter Storm Watch',
      'WW.Y':'Winter Weather Advisory',
      'ZR.Y':'Freezing Rain Advisory',
      'IS.W':'Ice Storm Warning',
      'SQ.W':'Snow Squall Warning',

      'TO.W':'Tornado Warning',
      'TO.A':'Tornado Watch',
      'SV.W':'Severe Thunderstorm Warning',
      'SV.A':'Severe Thunderstorm Watch',
      'FF.W':'Flash Flood Warning',
      'FF.A':'Flash Flood Watch',
      'FA.W':'Flood Warning',
      'FA.Y':'Flood Advisory',
      'FL.W':'Flood Warning',
      'FL.Y':'Flood Advisory',

      'MA.W':'Marine Warning',
      'GL.W':'Gale Warning',
      'SR.W':'Storm Warning'
    };
    if (MAP[key]) return MAP[key];
    return key;
  }

  const wfo = pickProp(p, ["WFO","wfo"]);
  const etn = pickProp(p, ["ETN","etn"]);
  return (wfo || etn) ? `Alert ${wfo || ""} ${etn || ""}`.trim() : "Alert";
}

function colorForAlertName(name){
  if (NWS_EVENT_COLOR[name]) return NWS_EVENT_COLOR[name];
  const lower = String(name).toLowerCase();
  if (lower.includes("blizzard") && lower.includes("warning")) return NWS_EVENT_COLOR["Blizzard Warning"];
  if (lower.includes("winter storm") && lower.includes("warning")) return NWS_EVENT_COLOR["Winter Storm Warning"];
  if (lower.includes("winter storm") && lower.includes("watch")) return NWS_EVENT_COLOR["Winter Storm Watch"];
  if (lower.includes('winter weather') && lower.includes('advisory')) return NWS_EVENT_COLOR['Winter Weather Advisory'];
  if (lower.includes('tornado') && lower.includes('warning')) return NWS_EVENT_COLOR['Tornado Warning'];
  if (lower.includes('tornado') && lower.includes('watch')) return NWS_EVENT_COLOR['Tornado Watch'];
  if (lower.includes('severe thunderstorm') && lower.includes('warning')) return NWS_EVENT_COLOR['Severe Thunderstorm Warning'];
  if (lower.includes('severe thunderstorm') && lower.includes('watch')) return NWS_EVENT_COLOR['Severe Thunderstorm Watch'];
  if (lower.includes('flash flood') && lower.includes('warning')) return NWS_EVENT_COLOR['Flash Flood Warning'];
  if (lower.includes('flash flood') && lower.includes('watch')) return NWS_EVENT_COLOR['Flash Flood Watch'];
  if (lower == 'flood warning') return NWS_EVENT_COLOR['Flood Warning'];
  if (lower == 'flood advisory') return NWS_EVENT_COLOR['Flood Advisory'];
  return '#CC0000'; // fallback

}

async function fetchFirstOk(urls){
  let lastErr = "";
  for (const u of urls){
    try{
      const r = await fetch(u, { cache:"no-store" });
      if (!r.ok) { lastErr = `HTTP ${r.status}`; continue; }
      const gj = await r.json();
      return { url: u, gj };
    } catch(e){
      lastErr = e.message || String(e);
    }
  }
  throw new Error(lastErr || "No alert file matched");
}

  if (!map.hasLayer(alertsLayer)) return;

  let candidates = [];

        const wfo = pickProp(p, ['WFO','wfo']);

        const issued = pickProp(p, ['issuance','issued','onset','ISSUANCE','ISSUED','ISSUE']);
        const expire = pickProp(p, ['expire','expires','end','EXPIRE','EXPIRES']);

        const lines = [];
        lines.push(`<div><span class="swatch" style="background:${c}"></span><b>${name}</b></div>`);
        if (wfo || etn) lines.push(`Office/Event: <b>${wfo || '—'}</b> / <b>${etn || '—'}</b>`);
        if (status) lines.push(`Status: <b>${status}</b>`);
        if (issued) lines.push(`Issued: <b>${issued}</b>`);
        if (expire) lines.push(`Expires: <b>${expire}</b>`);

        layer.bindPopup(lines.join('<br>'));
      }
    }).eachLayer(l => alertsLayer.addLayer(l));

    // Confirm which file loaded + how many polygons
    const short = url.replace('./','');
    setStatus(`Alerts loaded: ${short} | polygons: ${polyCount}`);

  } catch(e){
    console.warn('Alerts load failed:', e.message);
    alertsLayer.clearLayers();
    setStatus('Alerts not found for this hour (check filenames).');
  }
}

function normalizeVelocityJson(raw, opts={}){
  // Accept:
  // 1) Array of windy records [{header,data},{header,data}]
  // 2) Wrapper {data:[...records...]}
  // 3) Single record with interleaved u/v pairs in one record: data.length = nx*ny*2
  //
  // opts.flipDyPositive:
  //   - If true, and header.dy > 0, we flip rows so la1 becomes NORTH-most and dy becomes negative.
  const flipDyPositive = !!opts.flipDyPositive;

  function ensureBounds(h){
    if (!h) return h;
    const nx = h.nx || h.Nx;
    const ny = h.ny || h.Ny;
    const dx = (h.dx ?? h.Dx);
    const dy = (h.dy ?? h.Dy);
    const lo1 = (h.lo1 ?? h.Lo1);
    const la1 = (h.la1 ?? h.La1);
    if (nx && ny && typeof dx==="number" && typeof dy==="number" && typeof lo1==="number" && typeof la1==="number"){
      if (typeof h.lo2 !== "number" && typeof h.Lo2 !== "number") h.lo2 = lo1 + dx * (nx - 1);
      if (typeof h.la2 !== "number" && typeof h.La2 !== "number") h.la2 = la1 + dy * (ny - 1);
    }
    return h;
  }

  let arr = raw;
  if (raw && Array.isArray(raw.data)) arr = raw.data;
  if (!Array.isArray(arr)) return arr;

  function flipIfNeeded(field){
    if (!flipDyPositive) return field;
    if (!field || !field.header || !Array.isArray(field.data)) return field;

    const h0 = field.header || {};
    const h = ensureBounds(h0);
    const nx = h.nx || h.Nx;
    const ny = h.ny || h.Ny;
    const dy = h.dy ?? h.Dy;
    const la1 = h.la1 ?? h.La1;

    if (!nx || !ny || typeof dy !== "number" || typeof la1 !== "number") return field;

    // If dy > 0, the grid is SOUTH -> NORTH. Leaflet-velocity expects NORTH -> SOUTH.
    if (dy > 0){
      const out = new Array(nx * ny);
      for (let y=0; y<ny; y++){
        const srcRow = (ny - 1 - y) * nx;
        const dstRow = y * nx;
        for (let x=0; x<nx; x++){
          out[dstRow + x] = field.data[srcRow + x];
        }
      }
      field.data = out;
      field.header = { ...h, la1: la1 + dy * (ny - 1), la2: la1, dy: -dy };
    }
    return field;
  }

  // Special case: single record with interleaved u/v pairs
  if (arr.length === 1 && arr[0] && arr[0].header && Array.isArray(arr[0].data)){
    const h = arr[0].header || {};
    const nx = h.nx || h.Nx;
    const ny = h.ny || h.Ny;
    const d  = arr[0].data;

    if (nx && ny && d.length === nx*ny*2){
      const n = nx*ny;
      const u = new Array(n);
      const v = new Array(n);
      for (let i=0, j=0; i<n; i++, j+=2){
        u[i] = d[j];
        v[i] = d[j+1];
      }

      // Add the header fields leaflet-velocity expects
      const base = ensureBounds({ ...h });
      // leaflet-velocity relies on lo2/la2 for extent calculations
      const hu = { ...base, parameterCategory: 2, parameterNumber: 2, parameterNumberName: "eastward_wind", parameterUnit: "m/s" };
      const hv = { ...base, parameterCategory: 2, parameterNumber: 3, parameterNumberName: "northward_wind", parameterUnit: "m/s" };

      return [ flipIfNeeded({ header: hu, data: u }), flipIfNeeded({ header: hv, data: v }) ];
    }
  }

  // Normal case: multiple fields (u + v)
  return arr.map(rec => {
    if (rec && rec.header) rec.header = ensureBounds(rec.header);
    return flipIfNeeded(rec);
  });
}


async function refreshParticlesIfOn(){

}

let _jetFetchInFlight = null;
async function refreshJetIfOn(){
  if (!map.hasLayer(jetToggle)) return;

  if (typeof L.velocityLayer !== "function"){
    setStatus("Jet stream: leaflet-velocity did not load.");
    return;
  }

  // --- Choose a jet file (first existing wins) ---
  const JET_FILES = [
    // Preferred jet file name from Colab exporter:
    "jet_stream_wind.json",
    // Fallbacks:
    "wind_data.json",
    "jetstream/wind_data.json",
    // Legacy / older filenames (kept for backward compatibility):
    "jetstream/jetstream_western_us_250mb_20180414_18Z.json",
    "jetstream/era5_wind_250hPa_20180414_18z_latlon_fixed.json",
    "jetstream/era5_wind_250hPa_20180411_12z_latlon_fixed.json",
    "jetstream/era5_wind_250hPa_20180410_12z_latlon_fixed.json"
  ];

  let url = null;
  for (const f of JET_FILES){
    const testUrl = "./" + encodeURI(f);
    try{
      const head = await fetch(testUrl, { method:"HEAD", cache:"no-store" });
      if (head.ok){ url = testUrl; break; }
    }catch(_){}
  }
  if (!url){
    setStatus("Jet stream: could not find wind_data.json (root) or jetstream/wind_data.json");
    return;
  }

  try{
    const r = await fetch(url, { cache:"no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const raw = await r.json();

    // Accept:
    //  - [ {header:u, data:u}, {header:v, data:v} ]
    //  - [ {header:..., data:[u0,v0,u1,v1,...]} ] (interleaved)
    //  - {data:[...]} wrappers
    let arr = Array.isArray(raw) ? raw : (raw.data ? raw.data : [raw]);
    if (!arr.length) throw new Error("Empty JSON");

    const first = arr[0];
    if (!first.header || !first.data) throw new Error("Missing header/data");

    // Helper: normalize header for leaflet-velocity
    function normalizeHeader(h){
      const H = {...h};
      // normalize keys
      H.nx = H.nx ?? H.Nx;
      H.ny = H.ny ?? H.Ny;
      H.dx = H.dx ?? H.Dx;
      H.dy = H.dy ?? H.Dy;
      H.la1 = H.la1 ?? H.La1 ?? H.lat1 ?? H.latitude1;
      H.lo1 = H.lo1 ?? H.Lo1 ?? H.lon1 ?? H.longitude1;
      H.la2 = H.la2 ?? H.La2 ?? H.lat2 ?? H.latitude2;
      H.lo2 = H.lo2 ?? H.Lo2 ?? H.lon2 ?? H.longitude2;

      // Convert 0..360 lon to -180..180 if needed
      if (typeof H.lo1 === "number" && H.lo1 > 180) H.lo1 -= 360;
      if (typeof H.lo2 === "number" && H.lo2 > 180) H.lo2 -= 360;

      // If both corners are known, recompute dx/dy from corners (fixes bad sign issues)
      if (typeof H.lo1 === "number" && typeof H.lo2 === "number" && typeof H.nx === "number" && H.nx > 1){
        H.dx = (H.lo2 - H.lo1) / (H.nx - 1);
      }
      if (typeof H.la1 === "number" && typeof H.la2 === "number" && typeof H.ny === "number" && H.ny > 1){
        H.dy = (H.la2 - H.la1) / (H.ny - 1);
      }

      // Compute missing corners if needed
      if (typeof H.la2 !== "number" && typeof H.la1 === "number" && typeof H.dy === "number" && typeof H.ny === "number"){
        H.la2 = H.la1 + H.dy * (H.ny - 1);
      }
      if (typeof H.lo2 !== "number" && typeof H.lo1 === "number" && typeof H.dx === "number" && typeof H.nx === "number"){
        H.lo2 = H.lo1 + H.dx * (H.nx - 1);
      }

      // Clamp to WebMercator limits to avoid pole weirdness (keep orientation as-is)
      const LIM = 85.05112878;
      if (typeof H.la1 === "number") H.la1 = Math.max(-LIM, Math.min(LIM, H.la1));
      if (typeof H.la2 === "number") H.la2 = Math.max(-LIM, Math.min(LIM, H.la2));

      // If clamping changed la1/la2 but we still have dy/ny, recompute la2 to keep step consistent
      if (typeof H.la1 === "number" && typeof H.dy === "number" && typeof H.ny === "number" && H.ny > 1){
        // Keep dy sign; just ensure la2 matches la1 + dy*(ny-1)
        H.la2 = H.la1 + H.dy * (H.ny - 1);
        H.la2 = Math.max(-LIM, Math.min(LIM, H.la2));
      }

      return H;
    }

    // Build u/v records
    let uRec = null, vRec = null;

    if (arr.length >= 2 && arr[0].header && arr[1].header){
      // already separate u/v
      uRec = { header: normalizeHeader(arr[0].header), data: arr[0].data.slice() };
      vRec = { header: normalizeHeader(arr[1].header), data: arr[1].data.slice() };
      // enforce short names (helps some versions)
      uRec.header.shortName = "u";
      vRec.header.shortName = "v";
      uRec.header.parameterNumberName = uRec.header.parameterNumberName || "u_component_of_wind";
      vRec.header.parameterNumberName = vRec.header.parameterNumberName || "v_component_of_wind";
    }else{
      // interleaved (u0,v0,u1,v1,...)
      const h0 = normalizeHeader(first.header);
      const nx = h0.nx, ny = h0.ny;
      const n = nx * ny;
      const expected = n * 2;
      if (first.data.length !== expected){
        throw new Error(`Interleaved length mismatch: expected ${expected}, got ${first.data.length}`);
      }
      const u = new Array(n);
      const v = new Array(n);
      for (let i=0, j=0; i<n; i++, j+=2){
        u[i] = first.data[j];
        v[i] = first.data[j+1];
      }
      uRec = { header: {...h0, shortName:"u", parameterNumberName:"u_component_of_wind"}, data: u };
      vRec = { header: {...h0, shortName:"v", parameterNumberName:"v_component_of_wind"}, data: v };
    }

    // Sanity log so you can SEE where the file thinks it is
    const hb = uRec.header;
    console.log("Jet header (normalized):", hb);
    // Remove old layer
    if (jetLayer){
      try{ map.removeLayer(jetLayer); }catch(_){}
      jetLayer = null;
    }

    jetLayer = L.velocityLayer({
      pane: 'overlayPane',
      data: [uRec, vRec],
      displayValues: true,
      displayOptions: {
        velocityType: "250mb Wind",
        displayPosition: "bottomleft",
        displayEmptyString: "No wind data"
      },
      maxVelocity: 160,
      velocityScale: 0.015,
      particleAge: 90,
      particleMultiplier: 1/900,
      lineWidth: 1.6,
      opacity: 0.90
    });

    jetLayer.addTo(map);
    // Ensure map has finalized its layout before sizing the velocity canvas
    setTimeout(() => {
      try { map.invalidateSize({ animate: false, pan: false }); } catch(_) {}
    }, 150);
    setStatus(`Jet stream loaded: ${url.replace("./","")}`);

  }catch(e){
    console.error("Jet stream error:", e);
    setStatus(`Jet stream failed: ${e.message}`);
  }
}


/* Toggle handlers for particles + alerts + jet stream */
map.on("overlayadd", async (e) => {
  if (e.layer === particlesToggle) await refreshParticlesIfOn();
  if (e.layer === jetToggle) await refreshJetIfOn();
  if (e.layer === alertsLayer) await loadAlerts();
});
map.on("overlayremove", (e) => {
  if (e.layer === particlesToggle && particlesLayer){
    map.removeLayer(particlesLayer);
    particlesLayer = null;
  }
  if (e.layer === jetToggle && jetLayer){
    map.removeLayer(jetLayer);
    jetLayer = null;
  }
});

/* ------------------------------------------------------------
   12) Main refresh (METAR + alerts + arrows)
------------------------------------------------------------ */
async function refreshAll(){
  setStatus("Loading METARs…");

  // Keep MODIS layer synced to the current map day (only if turned on)
  try{ if (map.hasLayer(modis)) modis.setUrl(modisUrlForDate(current)); }catch(e){}

  const prev = new Date(current.getTime() - stepHours*3600*1000);

  const [sdNow, restNow, sdPrev, restPrev] = await Promise.all([
    fetchRows(current, SD_ONLY),
    fetchRows(current, REST),
    fetchRows(prev, SD_ONLY),
    fetchRows(prev, REST)
  ]);

  const rowsNow  = sdNow.concat(restNow);
  const rowsPrev = sdPrev.concat(restPrev);

  const prevAlt = new Map();
  for (const r of rowsPrev){
    const st = (r.station || "").trim();
    const a  = num(r.alti);
    if (st && a != null) prevAlt.set(st, a);
  }

  [tempLayer, dewLayer, windNumLayer, windArrowLayer, gustLayer, visLayer, presLayer, wxLayer].forEach(l => l.clearLayers());

  const z = map.getZoom();
  const minSep = dynamicMinSep();

  const idxTemp = new CollisionIndex(Math.max(24, minSep));
  const idxDew  = new CollisionIndex(Math.max(24, minSep));
  const idxWind = new CollisionIndex(Math.max(24, minSep));
  const idxGust = new CollisionIndex(Math.max(24, minSep));
  const idxVis  = new CollisionIndex(Math.max(24, minSep));
  const idxPres = new CollisionIndex(Math.max(24, minSep));
  const idxWx   = new CollisionIndex(Math.max(24, minSep));
  const idxArr  = new CollisionIndex(Math.max(30, minSep));

  // --- Prevent METAR circles from colliding with city labels (white bubbles) ---
  const citySep = 34; // px separation between any METAR marker center and a city label anchor
  const idxCity = new CollisionIndex(Math.max(30, citySep));

  // Seed the collision index with whichever city labels are currently active at this zoom
  const activeCities = [];
  if (z >= 4) activeCities.push(...CITIES_TIER1);
  if (z >= 6) activeCities.push(...CITIES_TIER2);
  if (z >= 7) activeCities.push(...CITIES_TIER3);

  for (const c of activeCities){
    const latC = c[1], lonC = c[2];
    const pC = map.latLngToLayerPoint([latC, lonC]);
    idxCity.canPlace(pC, citySep); // reserve space around label anchor
  }

  
  // --- Nudge a METAR if it would collide with a city label ---
  // We try a small set of pixel offsets (relative to the station point) to keep BOTH the city bubble and the METAR visible.
  // This is especially useful for Sioux Falls and other major hubs where you want the METAR to always show.
  const STATION_NUDGES = new Map([
    ["KFSD", [[24, 16],[26,-14],[-26,14],[-26,-14],[0,24],[0,-24],[32,0],[-32,0]]],
    ["FSD",  [[24, 16],[26,-14],[-26,14],[-26,-14],[0,24],[0,-24],[32,0],[-32,0]]],
    ["KDEN", [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
    ["DEN",  [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
    ["KOMA", [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
    ["OMA",  [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
  ]);

  function tryPlaceAgainstCityLabels(lat, lon, station, sepPx){
    const base = map.latLngToLayerPoint([lat, lon]);

    // Try original first
    if (idxCity.canPlace(base, sepPx)){
      const ll0 = map.layerPointToLatLng(base);
      return {lat: ll0.lat, lon: ll0.lng};
    }

    const key = (station || "").trim().toUpperCase();
    const nudges = STATION_NUDGES.get(key) || [[22,14],[22,-14],[-22,14],[-22,-14],[0,22],[0,-22],[30,0],[-30,0]];

    for (const o of nudges){
      const p = L.point(base.x + o[0], base.y + o[1]);
      if (idxCity.canPlace(p, sepPx)){
        const ll = map.layerPointToLatLng(p);
        return {lat: ll.lat, lon: ll.lng};
      }
    }
    return null;
  }

let shown = 0, total = 0;

  for (const r of rowsNow){
    const lat = num(r.lat), lon = num(r.lon);
    if (lat == null || lon == null) continue;
    total++;

    const st = (r.station || "").trim();

    // Keep METAR circles from colliding with city labels (white bubbles).
    // If it collides, try nudging the METAR slightly so BOTH remain visible.
    const placed = tryPlaceAgainstCityLabels(lat, lon, st, citySep);
    if (!placed) continue;
    const plat = placed.lat, plon = placed.lon;

const alti = num(r.alti);
    const prevA = st ? prevAlt.get(st) : null;
    const dAlt = (alti != null && prevA != null) ? (alti - prevA) : null;

    const popup = popupHTML(r, dAlt);

    const tmp = num(r.tmpf);
    const dew = num(r.dwpf);

    const drct = num(r.drct);
    const sknt = num(r.sknt);
    const gust = num(r.gust);

    const mph  = sknt != null ? ktToMph(sknt) : null;
    const gmh  = gust != null ? ktToMph(gust) : null;

    const visObj = parseVisMiles(r.vsby);
    const visMi = visObj.miles;

    if (tmp != null && allowByCollision(idxTemp, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(tmp)), tempColorF(tmp), 28, 12) })
        .bindPopup(popup).addTo(tempLayer);
    }

    if (dew != null && allowByCollision(idxDew, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(dew)), dewColorF(dew), 28, 12) })
        .bindPopup(popup).addTo(dewLayer);
    }

    if (mph != null && allowByCollision(idxWind, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(mph)), windColorMph(mph), 28, 12) })
        .bindPopup(popup).addTo(windNumLayer);
    }

    if (mph != null && drct != null && allowByCollision(idxArr, lat, lon, minSep)){
      const toDir = (drct + 180) % 360;
      L.marker([lat,lon], { icon: windArrowIcon(toDir, mph) })
        .bindPopup(popup).addTo(windArrowLayer);
    }

    if (gmh != null && allowByCollision(idxGust, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(gmh)), windColorMph(gmh), 30, 12) })
        .bindPopup(popup).addTo(gustLayer);
    }

    if ((visObj.label || "").trim() && allowByCollision(idxVis, lat, lon, minSep)){
      const style = visStyle(visMi);
      L.marker([lat,lon], { icon: dotIcon(visObj.label, style.bg, 30, 11, style.border) })
        .bindPopup(popup).addTo(visLayer);
    }

    if (alti != null && allowByCollision(idxPres, lat, lon, minSep)){
      const fill = pressureTrendColor(dAlt);
      L.marker([lat,lon], { icon: dotIcon(alti.toFixed(2), fill, 44, 12, "#999") })
        .bindPopup(popup).addTo(presLayer);
    }

    const wx = (r.wxcodes || "").trim();
    const isDay = isDaylightAt(lat, lon, current); // use current map time
    // Show an icon even if wx is blank (represents "clear/none"), but still obey thinning/collision.
    if (allowByCollision(idxWx, lat, lon, minSep)){
      L.marker([lat,lon], { icon: wxEmojiIcon(wx, isDay, 30) })
        .bindPopup(popup).addTo(wxLayer);
    }

    shown++;
  }

  setStatus(`Stations shown: ${shown}/${total} (minSep ${minSep}px).`);

  await loadAlerts();
}

refreshAll().catch(err => {
  console.error(err);
  setStatus("Error: " + err.message);
});
</script>
