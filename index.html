<script>
/* ------------------------------------------------------------
   1) Map
------------------------------------------------------------ */
const map = L.map("map", { zoomControl:true }).setView([44.2, -96.5], 6);

// ---------------------------------------------------------------------
// FIX: keep leaflet-velocity canvases INSIDE the Leaflet map panes.
// Some builds of leaflet-velocity will momentarily insert its canvas/container
// under <body>, which makes the particles draw at the top of the page
// instead of over the map (especially with an overlay banner).
// We watch for those nodes and immediately re-parent them into overlayPane.
// ---------------------------------------------------------------------
function _relocateVelocityDom(){
  try{
    if (!map || !map.getPanes) return;
    const overlayPane = map.getPanes().overlayPane;
    if (!overlayPane) return;

    const selectors = [
      ".leaflet-velocity-layer",
      ".leaflet-velocity-container",
      ".leaflet-velocity-overlay",
      "canvas.leaflet-velocity-overlay",
      "canvas.leaflet-velocity-layer"
    ];

    document.querySelectorAll(selectors.join(",")).forEach((node) => {
      if (!node) return;
      // If node isn't already in the map container, move it.
      if (!map.getContainer().contains(node)){
        overlayPane.appendChild(node);
      } else if (node.parentElement !== overlayPane && node.tagName === "CANVAS"){
        overlayPane.appendChild(node);
      }
      node.style.position = "absolute";
      node.style.left = "0";
      node.style.top = "0";
      node.style.pointerEvents = "none";
      node.style.zIndex = "350";
    });
  }catch(e){
    console.warn("velocity DOM relocate failed:", e);
  }
}

// Run once after initial layout, and again after Leaflet settles.
setTimeout(_relocateVelocityDom, 0);
setTimeout(_relocateVelocityDom, 250);

// Observe DOM insertions so we catch canvases created AFTER toggle-on.
(function(){
  try{
    const obs = new MutationObserver(() => _relocateVelocityDom());
    obs.observe(document.body, { childList:true, subtree:true });
    map.on("zoomstart movestart", _relocateVelocityDom);
    map.on("zoomend moveend resize", _relocateVelocityDom);
  }catch(e){
    console.warn("MutationObserver unavailable:", e);
  }
})();
window.map = map;
// --- leaflet-velocity DOM/pane alignment helpers ---
// leaflet-velocity occasionally appends its canvas/container to <body> instead of inside Leaflet's
// mapPane. When you have a fixed banner pushing the map down, that looks like particles "painting"
// at the very top of the page. This helper aggressively re-parents ALL velocity DOM into the
// map's overlayPane and forces its size/position to match the map.

function updateBannerOffset(){
  try{
    const banner = document.getElementById("banner");
    const h = banner ? Math.ceil(banner.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty("--banner-offset", h + "px");
    // If Leaflet has already initialized, re-measure the map after the CSS change.
    if (window.map && typeof window.map.invalidateSize === "function"){
      setTimeout(() => { try{ window.map.invalidateSize(); }catch(_){} }, 50);
    }

}

function fixVelocityDom(){
  try{
    if (!window.map || !window.map.getPanes) return;
    const overlayPane = window.map.getPanes().overlayPane;
    if (!overlayPane) return;

    const size = window.map.getSize ? window.map.getSize() : null;

    const nodes = document.querySelectorAll(
      ".leaflet-velocity-layer, .leaflet-velocity-overlay, .leaflet-velocity-container, canvas.leaflet-velocity-layer, canvas.leaflet-velocity-overlay"
    );

    nodes.forEach((node) => {
      if (!node) return;

      // Re-parent into Leaflet overlayPane (which is inside mapPane and inherits map transforms).
      if (node.parentElement !== overlayPane){
        try{ overlayPane.appendChild(node); }catch(_){}
      }

      // Force absolute positioning within the pane.
      node.style.position = "absolute";
      node.style.left = "0px";
      node.style.top = "0px";
      node.style.pointerEvents = "none";
      node.style.zIndex = "350";

      // Sync canvas backing store to the map size (prevents weird clipping/scaling).
      if (size && node.tagName === "CANVAS"){
        const w = Math.max(1, Math.round(size.x));
        const h = Math.max(1, Math.round(size.y));
        if (node.width !== w) node.width = w;
        if (node.height !== h) node.height = h;
        node.style.width = w + "px";
        node.style.height = h + "px";
      }else if (size && node.tagName === "DIV"){
        node.style.width = Math.max(1, Math.round(size.x)) + "px";
        node.style.height = Math.max(1, Math.round(size.y)) + "px";
      }
    });
  }catch(e){
    // keep silent; this is best-effort
  }
}

  }catch(_){}
})();

function forceVelocityIntoMap(){ fixVelocityDom(); }

// 2) Wrapper {data:[...records...]}
  // 3) Single record with interleaved u/v pairs in one record: data.length = nx*ny*2
  //
  // opts.flipDyPositive:
  //   - If true, and header.dy > 0, we flip rows so la1 becomes NORTH-most and dy becomes negative.
  const flipDyPositive = !!opts.flipDyPositive;

  function ensureBounds(h){
    if (!h) return h;
    const nx = h.nx || h.Nx;
    const ny = h.ny || h.Ny;
    const dx = (h.dx ?? h.Dx);
    const dy = (h.dy ?? h.Dy);
    const lo1 = (h.lo1 ?? h.Lo1);
    const la1 = (h.la1 ?? h.La1);
    if (nx && ny && typeof dx==="number" && typeof dy==="number" && typeof lo1==="number" && typeof la1==="number"){
      if (typeof h.lo2 !== "number" && typeof h.Lo2 !== "number") h.lo2 = lo1 + dx * (nx - 1);
      if (typeof h.la2 !== "number" && typeof h.La2 !== "number") h.la2 = la1 + dy * (ny - 1);
    }
    return h;
  }

  let arr = raw;
  if (raw && Array.isArray(raw.data)) arr = raw.data;
  if (!Array.isArray(arr)) return arr;

  function flipIfNeeded(field){
    if (!flipDyPositive) return field;
    if (!field || !field.header || !Array.isArray(field.data)) return field;

    const h0 = field.header || {};
    const h = ensureBounds(h0);
    const nx = h.nx || h.Nx;
    const ny = h.ny || h.Ny;
    const dy = h.dy ?? h.Dy;
    const la1 = h.la1 ?? h.La1;

    if (!nx || !ny || typeof dy !== "number" || typeof la1 !== "number") return field;

    // If dy > 0, the grid is SOUTH -> NORTH. Leaflet-velocity expects NORTH -> SOUTH.
    if (dy > 0){
      const out = new Array(nx * ny);
      for (let y=0; y<ny; y++){
        const srcRow = (ny - 1 - y) * nx;
        const dstRow = y * nx;
        for (let x=0; x<nx; x++){
          out[dstRow + x] = field.data[srcRow + x];
        }
      }
      field.data = out;
      field.header = { ...h, la1: la1 + dy * (ny - 1), la2: la1, dy: -dy };
    }
    return field;
  }

  // Special case: single record with interleaved u/v pairs
  if (arr.length === 1 && arr[0] && arr[0].header && Array.isArray(arr[0].data)){
    const h = arr[0].header || {};
    const nx = h.nx || h.Nx;
    const ny = h.ny || h.Ny;
    const d  = arr[0].data;

    if (nx && ny && d.length === nx*ny*2){
      const n = nx*ny;
      const u = new Array(n);
      const v = new Array(n);
      for (let i=0, j=0; i<n; i++, j+=2){
        u[i] = d[j];
        v[i] = d[j+1];
      }

      // Add the header fields leaflet-velocity expects
      const base = ensureBounds({ ...h });
      // leaflet-velocity relies on lo2/la2 for extent calculations
      const hu = { ...base, parameterCategory: 2, parameterNumber: 2, parameterNumberName: "eastward_wind", parameterUnit: "m/s" };
      const hv = { ...base, parameterCategory: 2, parameterNumber: 3, parameterNumberName: "northward_wind", parameterUnit: "m/s" };

      return [ flipIfNeeded({ header: hu, data: u }), flipIfNeeded({ header: hv, data: v }) ];
    }
  }

  // Normal case: multiple fields (u + v)
  return arr.map(rec => {
    if (rec && rec.header) rec.header = ensureBounds(rec.header);
    return flipIfNeeded(rec);
  });
}

let _jetFetchInFlight = null;
async function refreshJetIfOn(){
  if (!map.hasLayer(jetToggle)) return;

  if (typeof L.velocityLayer !== "function"){
    setStatus("Jet stream: leaflet-velocity did not load.");
    return;
  }

  // Use the clean filename in ./jetstream/
  const JET_URL = "./jetstream/era5_wind_250hPa_20180411_12z_mercator.json";

  try{
    const r = await fetch(JET_URL, { cache:"no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);

    const raw = await r.json();

    // Support: [{header,data}], {data:[...]}, or a single record
    const arr = Array.isArray(raw) ? raw : (raw && raw.data ? raw.data : [raw]);
    if (!arr || arr.length === 0) throw new Error("Empty jet stream JSON");

    const rec0 = arr[0];
    if (!rec0.header || !rec0.data) throw new Error("Jet stream JSON missing header/data");

    const h = rec0.header;
    const nx = Number(h.nx ?? h.Nx);
    const ny = Number(h.ny ?? h.Ny);
    const dxIn = Number(h.dx);
    const dyIn = Number(h.dy);
    const lo1 = Number(h.lo1);
    const la1_in = Number(h.la1);

    if (!Number.isFinite(nx) || !Number.isFinite(ny) || nx <= 0 || ny <= 0) throw new Error("Bad nx/ny in header");
    if (!Number.isFinite(dxIn) || !Number.isFinite(dyIn) || dxIn === 0 || dyIn === 0) throw new Error("Bad dx/dy in header");

    const expectedLen = nx * ny * 2; // interleaved u/v
    if (rec0.data.length !== expectedLen){
      throw new Error(`Data length mismatch: expected ${expectedLen}, got ${rec0.data.length}`);
    }

    const n = nx * ny;

    // Split interleaved u/v
    let u = new Float32Array(n);
    let v = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++, j += 2){
      u[i] = rec0.data[j];
      v[i] = rec0.data[j + 1];
    }

    // ----- CRITICAL: leaflet-velocity expects a NORTH->SOUTH grid -----
    // Many ERA5 exports come as SOUTH->NORTH (la1 is the southern edge and dy is positive).
    // If so, flip rows so index 0 is the northernmost row, and make dy negative.
    const laEnd = la1_in + dyIn * (ny - 1);
    const southToNorth = la1_in < laEnd; // true when la increases as row index increases

    const dx = Math.abs(dxIn);
    const dy = -Math.abs(dyIn); // force north->south

    let laNorth = Math.max(la1_in, laEnd);
    let laSouth = Math.min(la1_in, laEnd);

    if (southToNorth){
      const uFlip = new Float32Array(n);
      const vFlip = new Float32Array(n);
      for (let y = 0; y < ny; y++){
        const srcRow = (ny - 1 - y) * nx;
        const dstRow = y * nx;
        uFlip.set(u.subarray(srcRow, srcRow + nx), dstRow);
        vFlip.set(v.subarray(srcRow, srcRow + nx), dstRow);
      }
      u = uFlip;
      v = vFlip;
    }

    // Build headers in the format leaflet-velocity expects
    // lo2/ la2 are optional but helpful for debugging; dy must be negative.
    const lo2 = lo1 + dx * (nx - 1);
    const baseHeader = {
      lo1: lo1,
      la1: laNorth,
      dx: dx,
      dy: dy,
      nx: nx,
      ny: ny,
      lo2: lo2,
      la2: laSouth,
      refTime: h.refTime || h.ref_time || h.time || null
    };

    const uRecord = {
      header: {
        ...baseHeader,
        parameterCategory: 2,
        parameterNumber: 2,
        parameterNumberName: "u_component_of_wind",
        parameterUnit: "m/s",
        shortName: "u"
      },
      data: Array.from(u)
    };

    const vRecord = {
      header: {
        ...baseHeader,
        parameterCategory: 2,
        parameterNumber: 3,
        parameterNumberName: "v_component_of_wind",
        parameterUnit: "m/s",
        shortName: "v"
      },
      data: Array.from(v)
    };

    if (jetLayer){
      try{ map.removeLayer(jetLayer); }catch(_){}
      jetLayer = null;
    }

    jetLayer = L.velocityLayer({
      data: [uRecord, vRecord],
      displayValues: true,
      displayOptions: {
        velocityType: "250mb Wind",
        displayPosition: "bottomleft",
        displayEmptyString: "No wind data"
      },
      maxVelocity: 160,
      velocityScale: 0.015,
      particleAge: 90,
      particleMultiplier: 1/900,
      lineWidth: 1.6,
      opacity: 0.90
    });

    jetLayer.addTo(map);

    // Make sure the velocity canvas lives inside the Leaflet overlayPane.
    // (Some builds of leaflet-velocity attach to <body> which draws above the map.)
    try{ forceVelocityIntoMap(jetLayer); }catch(_){}
    try{ map.invalidateSize(true); }catch(_){}

    setStatus("Jet stream loaded.");
    console.log("Jet stream header (normalized):", baseHeader);
  }catch(e){
    console.error("Jet stream error:", e);
    setStatus(`Jet stream failed: ${e.message}`);
  }
}

/* ------------------------------------------------------------
   12) Main refresh (METAR + alerts + arrows)
------------------------------------------------------------ */
async function refreshAll(){
  setStatus("Loading METARs…");

  // Keep MODIS layer synced to the current map day (only if turned on)
  try{ if (map.hasLayer(modis)) modis.setUrl(modisUrlForDate(current)); }catch(e){}

  const prev = new Date(current.getTime() - stepHours*3600*1000);

  const [sdNow, restNow, sdPrev, restPrev] = await Promise.all([
    fetchRows(current, SD_ONLY),
    fetchRows(current, REST),
    fetchRows(prev, SD_ONLY),
    fetchRows(prev, REST)
  ]);

  const rowsNow  = sdNow.concat(restNow);
  const rowsPrev = sdPrev.concat(restPrev);

  const prevAlt = new Map();
  for (const r of rowsPrev){
    const st = (r.station || "").trim();
    const a  = num(r.alti);
    if (st && a != null) prevAlt.set(st, a);
  }

  [tempLayer, dewLayer, windNumLayer, windArrowLayer, gustLayer, visLayer, presLayer, wxLayer].forEach(l => l.clearLayers());

  const z = map.getZoom();
  const minSep = dynamicMinSep();

  const idxTemp = new CollisionIndex(Math.max(24, minSep));
  const idxDew  = new CollisionIndex(Math.max(24, minSep));
  const idxWind = new CollisionIndex(Math.max(24, minSep));
  const idxGust = new CollisionIndex(Math.max(24, minSep));
  const idxVis  = new CollisionIndex(Math.max(24, minSep));
  const idxPres = new CollisionIndex(Math.max(24, minSep));
  const idxWx   = new CollisionIndex(Math.max(24, minSep));
  const idxArr  = new CollisionIndex(Math.max(30, minSep));

  // --- Prevent METAR circles from colliding with city labels (white bubbles) ---
  const citySep = 34; // px separation between any METAR marker center and a city label anchor
  const idxCity = new CollisionIndex(Math.max(30, citySep));

  // Seed the collision index with whichever city labels are currently active at this zoom
  const activeCities = [];
  if (z >= 4) activeCities.push(...CITIES_TIER1);
  if (z >= 6) activeCities.push(...CITIES_TIER2);
  if (z >= 7) activeCities.push(...CITIES_TIER3);

  for (const c of activeCities){
    const latC = c[1], lonC = c[2];
    const pC = map.latLngToLayerPoint([latC, lonC]);
    idxCity.canPlace(pC, citySep); // reserve space around label anchor
  }

  
  // --- Nudge a METAR if it would collide with a city label ---
  // We try a small set of pixel offsets (relative to the station point) to keep BOTH the city bubble and the METAR visible.
  // This is especially useful for Sioux Falls and other major hubs where you want the METAR to always show.
  const STATION_NUDGES = new Map([
    ["KFSD", [[24, 16],[26,-14],[-26,14],[-26,-14],[0,24],[0,-24],[32,0],[-32,0]]],
    ["FSD",  [[24, 16],[26,-14],[-26,14],[-26,-14],[0,24],[0,-24],[32,0],[-32,0]]],
    ["KDEN", [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
    ["DEN",  [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
    ["KOMA", [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
    ["OMA",  [[26, 16],[26,-14],[-26,14],[-26,-14],[0,26],[0,-26],[36,0],[-36,0]]],
  ]);

  function tryPlaceAgainstCityLabels(lat, lon, station, sepPx){
    const base = map.latLngToLayerPoint([lat, lon]);

    // Try original first
    if (idxCity.canPlace(base, sepPx)){
      const ll0 = map.layerPointToLatLng(base);
      return {lat: ll0.lat, lon: ll0.lng};
    }

    const key = (station || "").trim().toUpperCase();
    const nudges = STATION_NUDGES.get(key) || [[22,14],[22,-14],[-22,14],[-22,-14],[0,22],[0,-22],[30,0],[-30,0]];

    for (const o of nudges){
      const p = L.point(base.x + o[0], base.y + o[1]);
      if (idxCity.canPlace(p, sepPx)){
        const ll = map.layerPointToLatLng(p);
        return {lat: ll.lat, lon: ll.lng};
      }
    }
    return null;
  }

let shown = 0, total = 0;

  for (const r of rowsNow){
    const lat = num(r.lat), lon = num(r.lon);
    if (lat == null || lon == null) continue;
    total++;

    const st = (r.station || "").trim();

    // Keep METAR circles from colliding with city labels (white bubbles).
    // If it collides, try nudging the METAR slightly so BOTH remain visible.
    const placed = tryPlaceAgainstCityLabels(lat, lon, st, citySep);
    if (!placed) continue;
    const plat = placed.lat, plon = placed.lon;

const alti = num(r.alti);
    const prevA = st ? prevAlt.get(st) : null;
    const dAlt = (alti != null && prevA != null) ? (alti - prevA) : null;

    const popup = popupHTML(r, dAlt);

    const tmp = num(r.tmpf);
    const dew = num(r.dwpf);

    const drct = num(r.drct);
    const sknt = num(r.sknt);
    const gust = num(r.gust);

    const mph  = sknt != null ? ktToMph(sknt) : null;
    const gmh  = gust != null ? ktToMph(gust) : null;

    const visObj = parseVisMiles(r.vsby);
    const visMi = visObj.miles;

    if (tmp != null && allowByCollision(idxTemp, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(tmp)), tempColorF(tmp), 28, 12) })
        .bindPopup(popup).addTo(tempLayer);
    }

    if (dew != null && allowByCollision(idxDew, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(dew)), dewColorF(dew), 28, 12) })
        .bindPopup(popup).addTo(dewLayer);
    }

    if (mph != null && allowByCollision(idxWind, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(mph)), windColorMph(mph), 28, 12) })
        .bindPopup(popup).addTo(windNumLayer);
    }

    if (mph != null && drct != null && allowByCollision(idxArr, lat, lon, minSep)){
      const toDir = (drct + 180) % 360;
      L.marker([lat,lon], { icon: windArrowIcon(toDir, mph) })
        .bindPopup(popup).addTo(windArrowLayer);
    }

    if (gmh != null && allowByCollision(idxGust, lat, lon, minSep)){
      L.marker([lat,lon], { icon: dotIcon(String(Math.round(gmh)), windColorMph(gmh), 30, 12) })
        .bindPopup(popup).addTo(gustLayer);
    }

    if ((visObj.label || "").trim() && allowByCollision(idxVis, lat, lon, minSep)){
      const style = visStyle(visMi);
      L.marker([lat,lon], { icon: dotIcon(visObj.label, style.bg, 30, 11, style.border) })
        .bindPopup(popup).addTo(visLayer);
    }

    if (alti != null && allowByCollision(idxPres, lat, lon, minSep)){
      const fill = pressureTrendColor(dAlt);
      L.marker([lat,lon], { icon: dotIcon(alti.toFixed(2), fill, 44, 12, "#999") })
        .bindPopup(popup).addTo(presLayer);
    }

    const wx = (r.wxcodes || "").trim();
    const isDay = isDaylightAt(lat, lon, current); // use current map time
    // Show an icon even if wx is blank (represents "clear/none"), but still obey thinning/collision.
    if (allowByCollision(idxWx, lat, lon, minSep)){
      L.marker([lat,lon], { icon: wxEmojiIcon(wx, isDay, 30) })
        .bindPopup(popup).addTo(wxLayer);
    }

    shown++;
  }

  setStatus(`Stations shown: ${shown}/${total} (minSep ${minSep}px).`);

  await loadAlerts();
}

refreshAll().catch(err => {
  console.error(err);
  setStatus("Error: " + err.message);
});
