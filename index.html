function refreshJetIfOn(data) {
    if (data) {
        // correct handling of interleaved u/v wind data for leaflet-velocity
        const windData = data.map((item) => {
            return {
                u: item.u,
                v: item.v
            };
        });
        // logic to update the leaflet-velocity visualization
        updateLeafletVelocity(windData);
    }
}
