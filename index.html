/* --- 1) Map Setup --- */

/* --- 2) Boundary Fix Logic --- */
function normalizeVelocityJson(raw, opts={}){
  const flipDyPositive = !!opts.flipDyPositive;
  function ensureBounds(h){
    if (!h) return h;
    const nx = h.nx || h.Nx, ny = h.ny || h.Ny;
    const dx = h.dx ?? h.Dx, dy = h.dy ?? h.Dy;
    const lo1 = h.lo1 ?? h.Lo1, la1 = h.la1 ?? h.La1;
    if (nx && ny && typeof dx === "number"){
      h.lo2 = h.lo2 ?? (lo1 + dx * (nx - 1));
      h.la2 = h.la2 ?? (la1 + dy * (ny - 1));
      h.nx = nx; h.ny = ny; h.dx = dx; h.dy = dy; h.lo1 = lo1; h.la1 = la1;
    }
    return h;
  }
  let arr = Array.isArray(raw) ? raw : (raw.data || []);
  return arr.map(field => {
    field.header = ensureBounds(field.header);
    if (flipDyPositive && field.header.dy > 0) {
      const {nx, ny} = field.header;
      const newData = new Float32Array(field.data.length);
      for (let y = 0; y < ny; y++) {
        for (let x = 0; x < nx; x++) newData[y * nx + x] = field.data[(ny - 1 - y) * nx + x];
      }
      field.data = newData;
      const oldLa1 = field.header.la1;
      field.header.la1 = field.header.la2; field.header.la2 = oldLa1;
      field.header.dy = -field.header.dy;
    }
    return field;
  });
}
