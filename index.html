<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Apr 2018 Case Study – METAR + Wind Arrows + Daily Particles + Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./leaflet.css"/>
<script src="./leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@2.1.4/dist/leaflet-velocity.css"/>
<script src="https://unpkg.com/leaflet-velocity@2.1.4/dist/leaflet-velocity.js"></script>

<style>
  html, body { height:100%; margin:0; }
  #map { height:100%; background:#fff; }

  .dot{
    border-radius:50%;
    border:2px solid #333;
    display:flex;align-items:center;justify-content:center;
    font:800 12px/1 Arial, sans-serif;
    color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
    user-select:none;
  }

  .swatch {
    display:inline-block;
    width:12px; height:12px;
    border:1px solid #333;
    border-radius:2px;
    vertical-align:middle;
    margin-right:6px;
  }

  .tvbanner{
    position:absolute; top:0; left:0; right:0;
    z-index:99999;
    background:rgba(11,28,45,0.90);
    color:#fff;
    border-bottom:2px solid rgba(255,255,255,0.12);
  }

  .tvbanner::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background:#2f4e94;
  }

  .banner-topline{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:10px 14px 6px 14px;
    font-family: Arial, sans-serif;
    text-transform:uppercase;
    letter-spacing:.7px;
    position:relative;
  }

  .top-lesson{font-weight:900;font-size:22px;white-space:nowrap}
  .top-sep{opacity:.65;font-weight:900}
  .top-question{font-weight:800;font-size:14px;letter-spacing:.2px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .top-q-label{font-weight:900;text-transform:uppercase;letter-spacing:.6px}

  .banner-divider{ height:3px; width:100%; background:#eab35b; opacity:0.95; }

  .banner-bottomline{ display:flex; justify-content:center; padding:2px 14px 6px 14px; gap:12px; flex-wrap:nowrap; }

  .product-center{ font:900 38px/1 Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; }

  .bbtn{ pointer-events:auto; border:1px solid rgba(255,255,255,0.35); background:rgba(0,0,0,0.25); color:#fff;
    padding:7px 10px; border-radius:10px; font-weight:800; cursor:pointer; font-size:12px; }

  .bbtn-story{
    position:absolute; right:16px; top:10px;
    background:#fdd835 !important; color:#111 !important;
    padding:10px 14px; border-radius:14px; font-weight:900;
  }

  .btime{ font:900 18px/1 Arial,sans-serif; letter-spacing:.7px; text-transform:uppercase; white-space:nowrap; min-width:180px; text-align:center; }
  
  #brandLogo{ position:absolute; right:10px; bottom:-24px; z-index:900; width:150px; opacity:0.95; filter: drop-shadow(0 3px 10px rgba(0,0,0,.35)); pointer-events:none; }

  .map-legend{ position:absolute; right:10px; bottom:62px; z-index:900; background:rgba(11,28,45,0.80); border:1px solid rgba(255,255,255,0.18); border-radius:12px; padding:7px 9px; color:#fff; font-family: Arial, sans-serif; }
  .leg-mini-bar{ width:120px; height:10px; border-radius:7px; background:linear-gradient(90deg,#2b83ba,#ffd166,#ef476f); }

  :root{ --banner-offset: 130px; }
  .leaflet-top{ top: var(--banner-offset) !important; }

  .town-label{ background: #ffffff; border:1px solid rgba(0,0,0,0.25); padding:2px 6px; border-radius:10px; font:800 11px/1 Arial, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
</style>
</head>

<body>

<div id="banner" class="tvbanner">
  <div class="banner-topline">
    <div class="topline-center">
      <span class="top-lesson">Lesson: METAR Analysis</span>
      <span class="top-sep">—</span>
      <span class="top-question"><span class="top-q-label">Question:</span> How can we use real-time weather data to make safer decisions?</span>
    </div>
    <button class="bbtn bbtn-story" id="beginStoryBtn">START</button>
  </div>
  <div class="banner-divider"></div>

  <div class="banner-bottomline">
    <div class="opacity-wrap">
      <span class="op-label" style="font-size:11px; font-weight:900; text-transform:uppercase;">Opacity</span>
      <input id="radarOpacity" type="range" min="20" max="100" value="70" style="width:140px;"/>
    </div>

    <div class="product-center" id="productLabel">METARS</div>

    <div class="time-wrap" style="display:flex; align-items:center; gap:10px;">
       <button class="bbtn" id="backBtnBanner">◀</button>
       <div class="btime" id="bannerTimeLabel">April 14, 2018 7AM</div>
       <input id="timeSlider" type="range" min="0" max="10" value="0" style="width:140px;"/>
       <button class="bbtn" id="fwdBtnBanner">▶</button>
    </div>

    <button class="bbtn" id="zoomOutBtnBanner">−</button>
    <button class="bbtn" id="zoomInBtnBanner">+</button>
  </div>
</div>

<img id="brandLogo" src="./logo.png" alt="Weather Workshops" />

<div class="map-legend">
  <div class="leg-mini-label" style="font-weight:900; font-size:11px; margin-bottom:4px;">WIND SPEED</div>
  <div class="leg-mini-bar"></div>
</div>

<div id="map"></div>

<script>
/* --- 1) Map Initialization --- */
const map = L.map("map", { zoomControl:true }).setView([44.2, -96.5], 6);

const osm = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", { 
  attribution: "© OpenStreetMap © CARTO", subdomains:"abcd", maxZoom: 19 
}).addTo(map);

/* --- 2) Data Normalizer (CRITICAL FIX FOR PARTICLES) --- */
function normalizeVelocityJson(raw, opts={}){
  const flipDyPositive = !!opts.flipDyPositive;

  function ensureBounds(h){
    if (!h) return h;
    const nx = h.nx || h.Nx;
    const ny = h.ny || h.Ny;
    const dx = (h.dx ?? h.Dx);
    const dy = (h.dy ?? h.Dy);
    const lo1 = (h.lo1 ?? h.Lo1);
    const la1 = (h.la1 ?? h.La1);
    
    if (nx && ny && typeof dx === "number" && typeof dy === "number" && typeof lo1 === "number" && typeof la1 === "number"){
      h.lo2 = h.lo2 ?? (lo1 + dx * (nx - 1));
      h.la2 = h.la2 ?? (la1 + dy * (ny - 1));
      h.nx = nx; h.ny = ny; h.dx = dx; h.dy = dy; h.lo1 = lo1; h.la1 = la1;
    }
    return h;
  }

  let arr = raw;
  if (raw && !Array.isArray(raw) && Array.isArray(raw.data)) arr = raw.data;
  if (!Array.isArray(arr)) return null;

  return arr.map(field => {
    if (!field || !field.header) return field;
    field.header = ensureBounds(field.header);
    
    if (flipDyPositive && field.header.dy > 0) {
        const nx = field.header.nx;
        const ny = field.header.ny;
        const newData = new Array(field.data.length);
        for (let y = 0; y < ny; y++) {
            for (let x = 0; x < nx; x++) {
                newData[y * nx + x] = field.data[(ny - 1 - y) * nx + x];
            }
        }
        field.data = newData;
        const oldLa1 = field.header.la1;
        field.header.la1 = field.header.la2; 
        field.header.la2 = oldLa1;
        field.header.dy = -field.header.dy;
    }
    return field;
  });
}

/* --- 3) Jet Stream Layer Logic --- */
const jetToggle = L.layerGroup();
let jetLayer = null;

async function refreshJetIfOn(){
  if (!map.hasLayer(jetToggle)) return;
  if (typeof L.velocityLayer !== "function") return;

  const url = "./jetstream/era5_wind_250hPa_20180410_12z_mercator.json";

  try{
    const r = await fetch(url, { cache:"no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const raw = await r.json();
    const velData = normalizeVelocityJson(raw, { flipDyPositive: true });

    if (jetLayer) { map.removeLayer(jetLayer); jetLayer = null; }

    jetLayer = L.velocityLayer({
      displayValues: true,
      displayOptions: { velocityType: "250mb Wind", position: "bottomleft" },
      data: velData,
      maxVelocity: 120,
      velocityScale: 0.006,
      particleAge: 90,
      particleMultiplier: 1/800,
      lineWidth: 1.8,
      opacity: 0.85
    });
    jetLayer.addTo(map);
  } catch(e) { console.warn("Jet Stream Load Failed:", e); }
}

/* --- 4) Layer Control --- */
const tempLayer = L.layerGroup().addTo(map);
const alertsLayer = L.geoJSON(null);
const particlesToggle = L.layerGroup();

L.control.layers(
  { "OpenStreetMap": osm },
  {
    "Temperature (°F)": tempLayer,
    "Alerts (WWA)": alertsLayer,
    "Daily wind particles": particlesToggle,
    "Jet stream (250mb) particles": jetToggle
  },
  { collapsed:false }
).addTo(map);

map.on("overlayadd", (e) => {
  if (e.layer === jetToggle) refreshJetIfOn();
});

/* --- UI Logic Placeholder (Keep your existing METAR/Time functions here) --- */
document.getElementById("beginStoryBtn").onclick = () => window.open("https://docs.google.com/spreadsheets/d/17Hzg7R2fSHJGbOKAKMqG4QAqA1GlSJwFM-SQwPhQObY/edit?gid=0#gid=0", "_blank");

</script>
</body>
</html>
